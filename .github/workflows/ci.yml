name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: Python models
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test
        run: pytest -q

  web:
    name: Browser engine
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Committed build is up to date
        run: |
          npm run build
          git status --porcelain -- dist
          test -z "$(git status --porcelain -- dist)"
      - name: Parity tests
        run: npm test
