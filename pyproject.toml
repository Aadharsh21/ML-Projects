[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ml-projects"
version = "2.0.0"
description = "Four machine learning projects (rain forecasting, fraud detection, insurance costs, clustering) with models exported for in-browser inference."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Aadharsh Arunn" }]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scipy>=1.11",
  "scikit-learn>=1.4",
  "lightgbm>=4.3",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8", "nbformat>=5.9", "nbclient>=0.10", "ipykernel>=6.29"]

[tool.setuptools]
packages = ["ml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["data: needs a downloaded dataset (skipped when ML_PROJECTS_OFFLINE=1)"]
